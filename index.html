<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta Sombria - Survival Waves</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #0d0e15; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; color: #ffffff; }
        #game-container { position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border-radius: 8px; overflow: hidden; border: 2px solid #2a2d3d; }
        canvas { display: block; background-color: #000; }
        #controls-hint { position: absolute; top: 12px; right: 12px; background: rgba(15, 18, 28, 0.85); padding: 10px 14px; border-radius: 6px; font-size: 12px; border: 1px solid rgba(255, 255, 255, 0.15); pointer-events: none; line-height: 1.5; text-align: right; backdrop-filter: blur(4px); }
        #controls-hint span { color: #ffd700; font-weight: bold; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    
    <div id="controls-hint">
        <b>Controles:</b><br>
        <span>1, 2, 3, 4, 5</span> : Slots de Item<br>
        <span>A / D</span> : Mover | <span>Espaço</span> : Pular<br>
        <span>Shift</span> : Correr | <span>C</span> : Agachar<br>
        <span>Clique Esquerdo</span> : Atacar<br>
        <span>Clique Direito</span> : Atirar / Consumir Item<br>
        <span>F</span> : Pegar Item | <span>G</span> : Dropar Item
    </div>
</div>

<script>
// Canvas & Contexto
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const WORLD_WIDTH = 2800;
const GROUND_Y = 480;

// Estados do Jogo
const STATE_MENU = "MENU";
const STATE_GAME = "GAME";
let currentState = STATE_MENU;

// Entradas
const keys = {};
let mousePos = { x: 0, y: 0 };
let mouseWorldPos = { x: 0, y: 0 };

// Estrutura de Ondas e Entidades
let onda = 1;
let mobs = [];
let projeteis = [];
let drops = [];
let floatingTexts = [];
let bossAtual = null;

window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
    
    if (currentState === STATE_GAME) {
        if (e.key >= "1" && e.key <= "5") player.selectedSlot = parseInt(e.key);
        if (e.key.toLowerCase() === "f") pickupNearbyItems();
        if (e.key.toLowerCase() === "g") dropCurrentItem();
    }
});

window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
});

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener("contextmenu", (e) => e.preventDefault());

canvas.addEventListener("mousedown", (e) => {
    if (currentState === STATE_MENU) {
        handleMenuClick(e);
        return;
    }

    if (currentState === STATE_GAME) {
        const now = performance.now();
        
        if (e.button === 0) { // Clique Esquerdo
            if (player.selectedSlot === 1) {
                if (now - player.lastSwordTime >= player.swordCooldown) {
                    player.lastSwordTime = now;
                    player.swingAnim = 1.0;
                    performSwordAttack();
                }
            } else if (player.selectedSlot === 3) {
                triggerBowShoot(now);
            }
        }

        if (e.button === 2) { // Clique Direito
            if (player.selectedSlot === 3) {
                triggerBowShoot(now);
            } else if (player.selectedSlot === 4 && player.rottenMeatCount > 0) {
                player.rottenMeatCount--;
                player.hp = Math.min(player.maxHp, player.hp + 20);
                createFloatingText(player.x + player.width/2, player.y - 10, "+20 HP", "#2ecc71");
                if (player.rottenMeatCount <= 0) player.inventory[4] = null;
                else player.inventory[4] = `Carne Podre (${player.rottenMeatCount})`;
            }
        }
    }
});

// Câmera
let cameraX = 0;
function updateCamera() {
    cameraX = player.x + player.width / 2 - WIDTH / 2;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > WORLD_WIDTH - WIDTH) cameraX = WORLD_WIDTH - WIDTH;
    mouseWorldPos.x = mousePos.x + cameraX;
    mouseWorldPos.y = mousePos.y;
}

// Textos Flutuantes
function createFloatingText(x, y, text, color = "#ffffff") {
    floatingTexts.push({ x, y, text, color, alpha: 1.0, vy: -1.5 });
}

function updateFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) floatingTexts.splice(i, 1);
    }
}

function drawFloatingTexts() {
    ctx.save();
    ctx.font = "bold 14px Arial";
    floatingTexts.forEach(ft => {
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x - cameraX, ft.y);
    });
    ctx.restore();
}

// Jogador
const player = {
    x: 140,
    y: GROUND_Y - 58,
    width: 32,
    normalHeight: 58,
    crouchHeight: 36,
    height: 58,
    vx: 0,
    vy: 0,
    isGrounded: false,
    hp: 100,
    maxHp: 100,
    
    selectedSlot: 1,
    inventory: { 1: "Espada Pesada", 2: "Escudo Gladiador", 3: "Arco de Caça", 4: null, 5: null },
    rottenMeatCount: 0,
    boneArrows: 0,

    // TIMERS AJUSTADOS
    lastSwordTime: -1500,
    swordCooldown: 1500, // Espada: 1.5s
    
    lastBowTime: -2000,
    bowCooldown: 2000, // Arco: 2.0s
    
    shieldCharges: 4,
    shieldMaxCharges: 4,
    shieldRegenTimer: 0,
    shieldRegenDuration: 15000, // Escudo: 15s
    isRegeneratingShield: false,

    veneno: { ativo: false, tempo: 0, timerDano: 0 },

    bowPulling: false,
    bowPullProgress: 0,
    swingAnim: 0,

    reset() {
        this.x = 140;
        this.y = GROUND_Y - 58;
        this.height = this.normalHeight;
        this.vx = 0;
        this.vy = 0;
        this.hp = 100;
        this.selectedSlot = 1;
        this.rottenMeatCount = 0;
        this.boneArrows = 0;
        this.inventory[4] = null;
        this.inventory[5] = null;
        this.shieldCharges = 4;
        this.isRegeneratingShield = false;
        this.lastSwordTime = -1500;
        this.lastBowTime = -2000;
        this.veneno = { ativo: false, tempo: 0, timerDano: 0 };
    },

    update() {
        let speed = (keys["shift"] || keys["shiftleft"] || keys["shiftright"]) ? 5.5 : 3.2;
        
        if (keys["c"]) {
            if (this.height !== this.crouchHeight) {
                this.height = this.crouchHeight;
                this.y += (this.normalHeight - this.crouchHeight);
            }
            speed *= 0.5;
        } else {
            if (this.height !== this.normalHeight) {
                this.y -= (this.normalHeight - this.crouchHeight);
                this.height = this.normalHeight;
            }
        }

        this.vx = 0;
        if (keys["a"] || keys["arrowleft"]) this.vx = -speed;
        if (keys["d"] || keys["arrowright"]) this.vx = speed;

        if ((keys[" "] || keys["space"]) && this.isGrounded) {
            this.vy = -11.5;
            this.isGrounded = false;
        }

        this.vy += 0.55;
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0) this.x = 0;
        if (this.x > WORLD_WIDTH - this.width) this.x = WORLD_WIDTH - this.width;

        if (this.y + this.height >= GROUND_Y) {
            this.y = GROUND_Y - this.height;
            this.vy = 0;
            this.isGrounded = true;
        }

        // Veneno
        if (this.veneno.ativo) {
            this.veneno.tempo -= 1/60;
            this.veneno.timerDano += 1/60;
            if (this.veneno.timerDano >= 1.0) {
                this.hp -= 4;
                createFloatingText(this.x + this.width/2, this.y - 10, "-4 Veneno", "#8e24aa");
                this.veneno.timerDano = 0;
            }
            if (this.veneno.tempo <= 0) this.veneno.ativo = false;
        }

        // Regeneração do Escudo
        const now = performance.now();
        if (this.shieldCharges < this.shieldMaxCharges) {
            if (!this.isRegeneratingShield) {
                this.isRegeneratingShield = true;
                this.shieldRegenTimer = now;
            } else if (now - this.shieldRegenTimer >= this.shieldRegenDuration) {
                this.shieldCharges = this.shieldMaxCharges;
                this.isRegeneratingShield = false;
                createFloatingText(this.x + this.width/2, this.y - 15, "Escudo Regenerado!", "#3498db");
            }
        }

        if (this.swingAnim > 0) {
            this.swingAnim -= 0.08;
            if (this.swingAnim < 0) this.swingAnim = 0;
        }

        if (this.bowPulling) {
            this.bowPullProgress += 0.15;
            if (this.bowPullProgress >= 1) {
                this.bowPullProgress = 0;
                this.bowPulling = false;
            }
        }
    },

    draw() {
        const renderX = this.x - cameraX;

        // Sombra
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.beginPath();
        ctx.ellipse(renderX + this.width/2, GROUND_Y, 18, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Corpo
        ctx.fillStyle = this.veneno.ativo ? "#8e24aa" : "#2980b9";
        ctx.fillRect(renderX + 4, this.y + 18, this.width - 8, this.height - 28);

        // Calça
        ctx.fillStyle = "#1a252f";
        ctx.fillRect(renderX + 6, this.y + this.height - 10, 8, 10);
        ctx.fillRect(renderX + this.width - 14, this.y + this.height - 10, 8, 10);

        // Cabeça
        ctx.fillStyle = "#f1c40f";
        ctx.fillRect(renderX + 2, this.y, this.width - 4, 8);
        ctx.fillStyle = "#f39c12";
        ctx.fillRect(renderX + 4, this.y + 6, this.width - 8, 14);

        // Olho
        ctx.fillStyle = "#2c3e50";
        const eyeOffsetX = (mouseWorldPos.x > this.x + this.width/2) ? 18 : 8;
        ctx.fillRect(renderX + eyeOffsetX, this.y + 10, 4, 4);

        // Braço / Arma
        const shoulderX = renderX + (mouseWorldPos.x > this.x + this.width/2 ? 22 : 10);
        const shoulderY = this.y + 22;
        const angle = Math.atan2(mouseWorldPos.y - shoulderY, mouseWorldPos.x - shoulderX);
        const armLength = 16;
        const handX = shoulderX + Math.cos(angle) * armLength;
        const handY = shoulderY + Math.sin(angle) * armLength;

        ctx.strokeStyle = "#e67e22";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(shoulderX, shoulderY);
        ctx.lineTo(handX, handY);
        ctx.stroke();

        ctx.save();
        ctx.translate(handX, handY);
        ctx.rotate(angle);

        if (this.selectedSlot === 1) { // Espada
            let swingAngle = (this.swingAnim > 0) ? Math.sin(this.swingAnim * Math.PI) * 0.8 : 0;
            ctx.rotate(swingAngle);
            ctx.fillStyle = "#7f8c8d"; ctx.fillRect(-2, -2, 8, 4);
            ctx.fillStyle = "#e74c3c"; ctx.fillRect(6, -6, 4, 12);
            ctx.fillStyle = "#ecf0f1";
            ctx.beginPath();
            ctx.moveTo(10, -4); ctx.lineTo(42, -2); ctx.lineTo(48, 0); ctx.lineTo(42, 2); ctx.lineTo(10, 4);
            ctx.closePath(); ctx.fill(); ctx.strokeStyle = "#bdc3c7"; ctx.stroke();
        } else if (this.selectedSlot === 2) { // Escudo
            ctx.rotate(Math.PI / 2);
            if (this.shieldCharges > 0) {
                ctx.fillStyle = "rgba(52, 152, 219, 0.25)";
                ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2); ctx.fill();
            }
            ctx.fillStyle = (this.shieldCharges > 0) ? "#95a5a6" : "#7f8c8d";
            ctx.beginPath(); ctx.moveTo(-16, -14); ctx.lineTo(16, -14); ctx.lineTo(0, 22); ctx.closePath(); ctx.fill();
            ctx.strokeStyle = (this.shieldCharges > 0) ? "#ecf0f1" : "#34495e"; ctx.lineWidth = 3; ctx.stroke();
            ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.arc(0, -2, 5, 0, Math.PI * 2); ctx.fill();
        } else if (this.selectedSlot === 3) { // Arco
            const pullOffset = this.bowPullProgress * 8;
            ctx.strokeStyle = "#8e44ad"; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(0, 0, 20, -Math.PI / 2.2, Math.PI / 2.2); ctx.stroke();
            ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(Math.cos(-Math.PI / 2.2) * 20, Math.sin(-Math.PI / 2.2) * 20);
            ctx.lineTo(-pullOffset, 0);
            ctx.lineTo(Math.cos(Math.PI / 2.2) * 20, Math.sin(Math.PI / 2.2) * 20);
            ctx.stroke();
            if (this.bowPulling) {
                ctx.strokeStyle = "#f39c12"; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(-pullOffset, 0); ctx.lineTo(22, 0); ctx.stroke();
            }
        } else if (this.selectedSlot === 4 && this.rottenMeatCount > 0) {
            ctx.fillStyle = "#556b2f"; ctx.fillRect(4, -8, 14, 16); ctx.strokeStyle = "#2e3b14"; ctx.strokeRect(4, -8, 14, 16);
        }

        ctx.restore();
    }
};

// Disparo e Ataques
function triggerBowShoot(now) {
    if (now - player.lastBowTime >= player.bowCooldown) {
        player.lastBowTime = now;
        player.bowPulling = true;
        player.bowPullProgress = 0;
        const shoulderX = player.x + (mouseWorldPos.x > player.x + player.width/2 ? 22 : 10);
        const shoulderY = player.y + 22;
        projeteis.push(new Projectile(shoulderX, shoulderY, mouseWorldPos.x, mouseWorldPos.y, 13, 13, false, 'flecha'));
    }
}

function performSwordAttack() {
    const attackRange = 75;
    const isFacingRight = mouseWorldPos.x >= player.x + player.width/2;

    mobs.forEach(m => {
        const inXRange = isFacingRight ? 
            (m.x >= player.x && m.x <= player.x + player.width + attackRange) :
            (m.x + m.width >= player.x - attackRange && m.x <= player.x);
        const inYRange = Math.abs((m.y + m.height/2) - (player.y + player.height/2)) < 60;

        if (inXRange && inYRange) {
            m.hp -= 15;
            m.vx = isFacingRight ? 5 : -5;
            createFloatingText(m.x + m.width/2, m.y - 10, "-15 HP", "#e74c3c");
        }
    });

    if (bossAtual) {
        const inXRange = isFacingRight ? 
            (bossAtual.x >= player.x && bossAtual.x <= player.x + player.width + attackRange + 30) :
            (bossAtual.x + bossAtual.width >= player.x - attackRange - 30 && bossAtual.x <= player.x);
        if (inXRange) {
            bossAtual.hp -= 15;
            createFloatingText(bossAtual.x + bossAtual.width/2, bossAtual.y - 10, "-15 HP", "#e74c3c");
        }
    }
}

// Projéteis
class Projectile {
    constructor(x, y, targetX, targetY, speed = 12, damage = 10, deInimigo = false, tipo = 'flecha') {
        this.x = x;
        this.y = y;
        this.speed = speed;
        this.damage = damage;
        this.deInimigo = deInimigo;
        this.tipo = tipo;

        const angle = Math.atan2(targetY - y, targetX - x);
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.active = true;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > WORLD_WIDTH || this.y < 0 || this.y > HEIGHT) {
            this.active = false;
        }
    }

    draw() {
        const renderX = this.x - cameraX;
        ctx.fillStyle = this.deInimigo ? (this.tipo === 'fogo' ? '#ff3d00' : '#e0e0e0') : '#f1c40f';
        ctx.beginPath();
        ctx.arc(renderX, this.y, 5, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Inimigos e Mobs
class Enemy {
    constructor(x, y, tipo) {
        this.x = x;
        this.y = y;
        this.tipo = tipo;
        this.width = 32;
        this.height = 58;
        this.vx = 0;
        this.cooldownTiro = 0;

        if (tipo === 'zumbi') { this.hp = 30; this.maxHp = 30; this.speed = 1.4; this.cor = '#27ae60'; }
        if (tipo === 'esqueleto') { this.hp = 25; this.maxHp = 25; this.speed = 1.1; this.cor = '#e0e0e0'; }
        if (tipo === 'aranha') { this.hp = 40; this.maxHp = 40; this.speed = 2.0; this.height = 30; this.cor = '#8e24aa'; }
    }

    update() {
        this.x += this.vx;
        this.vx *= 0.8;

        const dx = player.x - this.x;
        if (Math.abs(this.vx) < 0.2) {
            if (dx > 0) this.x += this.speed;
            else this.x -= this.speed;
        }

        if (this.tipo === 'esqueleto') {
            this.cooldownTiro += 1/60;
            if (this.cooldownTiro >= 3.5) {
                projeteis.push(new Projectile(this.x + 16, this.y + 20, player.x + 16, player.y + 20, 8, 10, true, 'flecha'));
                this.cooldownTiro = 0;
            }
        }

        if (this.checkCollision(player)) {
            if (this.tipo === 'aranha' && !player.veneno.ativo) {
                player.veneno = { ativo: true, tempo: 5, timerDano: 0 };
                createFloatingText(player.x + player.width/2, player.y - 15, "VENENO!", "#8e24aa");
            }
            if (player.selectedSlot === 2 && player.shieldCharges > 0) {
                player.shieldCharges--;
                createFloatingText(player.x + player.width/2, player.y - 15, "BLOQUEADO!", "#3498db");
            } else {
                player.hp -= (this.tipo === 'zumbi' ? 8 : 5);
                createFloatingText(player.x + player.width/2, player.y - 15, "-DANO", "#e74c3c");
            }
            this.x += (dx > 0 ? -30 : 30);
        }
    }

    checkCollision(rect) {
        return (
            this.x < rect.x + rect.width &&
            this.x + this.width > rect.x &&
            this.y < rect.y + rect.height &&
            this.y + this.height > rect.y
        );
    }

    draw() {
        const renderX = this.x - cameraX;
        ctx.fillStyle = this.cor;
        ctx.fillRect(renderX, this.y, this.width, this.height);

        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(renderX, this.y - 10, this.width, 4);
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(renderX, this.y - 10, this.width * Math.max(0, this.hp / this.maxHp), 4);
    }
}

class Boss {
    constructor(nome, hp, cor) {
        this.nome = nome;
        this.hp = hp;
        this.maxHp = hp;
        this.width = 60;
        this.height = 80;
        this.x = player.x + 400;
        this.y = GROUND_Y - this.height;
        this.cor = cor;
        this.timerAtaque = 0;
        this.voador = (nome === 'Fenix');
        if (this.voador) this.y = GROUND_Y - 200;
    }

    update() {
        this.timerAtaque += 1/60;

        if (this.nome === 'Fenix' && this.timerAtaque >= 2.5) {
            projeteis.push(new Projectile(this.x + 30, this.y + 40, player.x + 16, player.y + 20, 7, 20, true, 'fogo'));
            this.timerAtaque = 0;
        }

        if (this.nome === 'Yeti' && this.timerAtaque >= 3.0) {
            projeteis.push(new Projectile(this.x + 30, this.y + 40, player.x + 16, player.y + 20, 9, 25, true, 'gelo'));
            this.timerAtaque = 0;
        }

        if (this.nome === 'Fada da Natureza' && this.timerAtaque >= 2.0) {
            projeteis.push(new Projectile(this.x + 30, this.y + 40, player.x + 16, player.y + 20, 8, 15, true, 'veneno'));
            this.timerAtaque = 0;
        }
    }

    draw() {
        const renderX = this.x - cameraX;
        ctx.fillStyle = this.cor;
        ctx.fillRect(renderX, this.y, this.width, this.height);
    }
}

// Drops de Itens
class DropItem {
    constructor(x, y, tipo, count = 1) {
        this.x = x; this.y = y; this.tipo = tipo; this.count = count;
        this.width = 16; this.height = 16;
    }

    draw() {
        const renderX = this.x - cameraX;
        ctx.fillStyle = this.tipo === 'carne' ? '#556b2f' : '#ffffff';
        ctx.fillRect(renderX, this.y, this.width, this.height);
        ctx.fillStyle = "#ffffff"; ctx.font = "bold 10px Arial";
        ctx.fillText(`[F] ${this.tipo}`, renderX - 5, this.y - 5);
    }
}

function pickupNearbyItems() {
    for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i];
        let dist = Math.hypot((player.x + player.width/2) - (d.x + d.width/2), (player.y + player.height/2) - (d.y + d.height/2));
        if (dist < 70) {
            if (d.tipo === 'carne') {
                player.rottenMeatCount += d.count;
                player.inventory[4] = `Carne Podre (${player.rottenMeatCount})`;
            } else if (d.tipo === 'osso') {
                player.boneArrows += d.count;
                player.inventory[5] = `Ossos (${player.boneArrows})`;
            }
            createFloatingText(d.x, d.y, `+${d.count} ${d.tipo}`, "#27ae60");
            drops.splice(i, 1);
        }
    }
}

function dropCurrentItem() {
    if (player.selectedSlot === 4 && player.rottenMeatCount > 0) {
        drops.push(new DropItem(player.x, player.y + 10, 'carne', player.rottenMeatCount));
        player.rottenMeatCount = 0; player.inventory[4] = null;
    }
}

// Gerenciador de Ondas
function iniciarOnda(num) {
    mobs = [];
    bossAtual = null;

    if (num === 5) {
        bossAtual = new Boss('Yeti', 200, '#00d2ff');
        mobs.push(new Enemy(player.x + 500, GROUND_Y - 58, 'zumbi'));
    } else if (num === 10) {
        bossAtual = new Boss('Fenix', 300, '#ff3d00');
        mobs.push(new Enemy(player.x + 400, GROUND_Y - 30, 'aranha'));
    } else if (num === 15) {
        bossAtual = new Boss('Fada da Natureza', 500, '#00e676');
    } else {
        let qtd = 4 + num * 2;
        for (let i = 0; i < qtd; i++) {
            let tipo = i % 3 === 0 ? 'esqueleto' : (i % 3 === 1 ? 'aranha' : 'zumbi');
            let spawnX = player.x + 400 + (i * 80);
            if (spawnX > WORLD_WIDTH - 100) spawnX = player.x - 300 - (i * 50);
            mobs.push(new Enemy(spawnX, GROUND_Y - (tipo === 'aranha' ? 30 : 58), tipo));
        }
    }
}

// Menu Click
const btnStart = { x: WIDTH / 2 - 110, y: 340, w: 220, h: 50 };
function handleMenuClick(e) {
    if (mousePos.x >= btnStart.x && mousePos.x <= btnStart.x + btnStart.w &&
        mousePos.y >= btnStart.y && mousePos.y <= btnStart.y + btnStart.h) {
        player.reset();
        onda = 1;
        iniciarOnda(onda);
        projeteis = []; drops = []; floatingTexts = [];
        currentState = STATE_GAME;
    }
}

function drawMenu() {
    ctx.fillStyle = "#1a0f0a"; ctx.fillRect(0, 0, WIDTH, HEIGHT);
    ctx.fillStyle = "#f39c12"; ctx.font = "bold 38px Arial"; ctx.textAlign = "center";
    ctx.fillText("FLORESTA SOMBRIA - SURVIVAL", WIDTH / 2, 180);

    ctx.fillStyle = "#2ecc71";
    ctx.beginPath(); ctx.roundRect(btnStart.x, btnStart.y, btnStart.w, btnStart.h, 8); ctx.fill();
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 20px Arial";
    ctx.fillText("INICIAR JOGO", WIDTH / 2, btnStart.y + 32);
}

function drawWorldBackground() {
    ctx.fillStyle = "#1a2a3a"; ctx.fillRect(0, 0, WIDTH, GROUND_Y);
    ctx.fillStyle = "#27ae60"; ctx.fillRect(0, GROUND_Y, WIDTH, 16);
    ctx.fillStyle = "#795548"; ctx.fillRect(0, GROUND_Y + 16, WIDTH, HEIGHT - GROUND_Y - 16);
}

function drawHUD() {
    const now = performance.now();

    // Vida
    ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(16, 16, 208, 22);
    ctx.fillStyle = "#e74c3c"; ctx.fillRect(20, 20, Math.max(0, (player.hp / player.maxHp) * 200), 14);
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 12px Arial"; ctx.textAlign = "left";
    ctx.fillText(`VIDA: ${Math.ceil(player.hp)} / ${player.maxHp}`, 26, 32);

    // Onda
    ctx.fillStyle = "#ffffff"; ctx.font = "bold 22px Arial"; ctx.textAlign = "center";
    ctx.fillText(`ONDA ${onda}`, WIDTH / 2, 35);

    // Barra do Boss
    if (bossAtual) {
        ctx.fillStyle = "#333"; ctx.fillRect(WIDTH / 2 - 200, 48, 400, 16);
        ctx.fillStyle = bossAtual.cor; ctx.fillRect(WIDTH / 2 - 200, 48, (bossAtual.hp / bossAtual.maxHp) * 400, 16);
        ctx.fillStyle = "#fff"; ctx.font = "12px Arial";
        ctx.fillText(`[${bossAtual.nome}]`, WIDTH / 2, 61);
    }

    // 5 Slots do Inventário
    const slotW = 70; const slotH = 50; const startX = (WIDTH - (slotW * 5 + 40)) / 2; const startY = HEIGHT - 65;
    ctx.fillStyle = "rgba(15, 18, 28, 0.9)";
    ctx.beginPath(); ctx.roundRect(startX - 10, startY - 8, (slotW * 5 + 60), slotH + 16, 8); ctx.fill();

    for (let slot = 1; slot <= 5; slot++) {
        const x = startX + (slot - 1) * (slotW + 10);
        const isSelected = (player.selectedSlot === slot);

        ctx.fillStyle = isSelected ? "rgba(52, 152, 219, 0.3)" : "rgba(255, 255, 255, 0.05)";
        ctx.fillRect(x, startY, slotW, slotH);
        ctx.strokeStyle = isSelected ? "#f1c40f" : "rgba(255,255,255,0.2)";
        ctx.strokeRect(x, startY, slotW, slotH);

        ctx.fillStyle = "#f1c40f"; ctx.font = "bold 10px Arial"; ctx.textAlign = "left";
        ctx.fillText(`[${slot}]`, x + 4, startY + 12);

        let label = "Vazio"; let subText = "";
        if (slot === 1) {
            label = "Espada";
            const cd = Math.max(0, ((player.swordCooldown - (now - player.lastSwordTime)) / 1000)).toFixed(1);
            if (cd > 0) subText = `${cd}s`;
        } else if (slot === 2) {
            label = "Escudo";
            subText = `${player.shieldCharges}/4 Def`;
            if (player.shieldCharges < 4) {
                const cd = Math.max(0, ((player.shieldRegenDuration - (now - player.shieldRegenTimer)) / 1000)).toFixed(0);
                subText += ` (${cd}s)`;
            }
        } else if (slot === 3) {
            label = "Arco";
            const cd = Math.max(0, ((player.bowCooldown - (now - player.lastBowTime)) / 1000)).toFixed(1);
            if (cd > 0) subText = `${cd}s`;
        } else if (slot === 4 && player.rottenMeatCount > 0) {
            label = "Carne"; subText = `x${player.rottenMeatCount}`;
        } else if (slot === 5 && player.boneArrows > 0) {
            label = "Ossos"; subText = `x${player.boneArrows}`;
        }

        ctx.fillStyle = "#fff"; ctx.fillText(label, x + 4, startY + 26);
        if (subText) { ctx.fillStyle = "#e67e22"; ctx.fillText(subText, x + 4, startY + 40); }
    }
}

// Loop Principal
function gameLoop() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    if (currentState === STATE_MENU) {
        drawMenu();
    } else if (currentState === STATE_GAME) {
        player.update();
        updateCamera();

        // Atualizar Projéteis
        for (let i = projeteis.length - 1; i >= 0; i--) {
            let p = projeteis[i];
            p.update();
            if (!p.active) { projeteis.splice(i, 1); continue; }

            if (p.deInimigo) {
                if (p.x >= player.x && p.x <= player.x + player.width && p.y >= player.y && p.y <= player.y + player.height) {
                    player.hp -= p.damage;
                    createFloatingText(player.x + player.width / 2, player.y - 15, `-${p.damage} HP`, "#e74c3c");
                    p.active = false;
                }
            } else {
                for (let m of mobs) {
                    if (p.x >= m.x && p.x <= m.x + m.width && p.y >= m.y && p.y <= m.y + m.height) {
                        m.hp -= p.damage;
                        m.vx = (p.vx > 0) ? 3 : -3;
                        createFloatingText(m.x + m.width / 2, m.y - 10, `-${p.damage} HP`, "#f1c40f");
                        p.active = false; break;
                    }
                }
                if (bossAtual && p.active) {
                    if (p.x >= bossAtual.x && p.x <= bossAtual.x + bossAtual.width && p.y >= bossAtual.y && p.y <= bossAtual.y + bossAtual.height) {
                        bossAtual.hp -= p.damage;
                        createFloatingText(bossAtual.x + bossAtual.width / 2, bossAtual.y - 10, `-${p.damage} HP`, "#f1c40f");
                        p.active = false;
                    }
                }
            }
        }

        // Atualizar Mobs
        for (let i = mobs.length - 1; i >= 0; i--) {
            let m = mobs[i];
            m.update();
            if (m.hp <= 0) {
                if (m.tipo === 'esqueleto') drops.push(new DropItem(m.x, GROUND_Y - 20, 'osso', 1));
                else drops.push(new DropItem(m.x, GROUND_Y - 20, 'carne', Math.floor(Math.random() * 2) + 1));
                mobs.splice(i, 1);
            }
        }

        // Atualizar Boss
        if (bossAtual) {
            bossAtual.update();
            if (bossAtual.hp <= 0) {
                createFloatingText(bossAtual.x, bossAtual.y, "BOSS DERROTADO!", "#f1c40f");
                bossAtual = null;
            }
        }

        // Fim de Onda
        if (mobs.length === 0 && !bossAtual) {
            onda++;
            iniciarOnda(onda);
            createFloatingText(player.x + player.width / 2, player.y - 30, `ONDA ${onda}!`, "#f1c40f");
        }

        updateFloatingTexts();

        // Renderização
        drawWorldBackground();
        drops.forEach(d => d.draw());
        projeteis.forEach(p => p.draw());
        mobs.forEach(m => m.draw());
        if (bossAtual) bossAtual.draw();
        player.draw();
        drawFloatingTexts();
        drawHUD();

        if (player.hp <= 0) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = "#e74c3c"; ctx.font = "bold 42px Arial"; ctx.textAlign = "center";
            ctx.fillText("VOCÊ MORREU", WIDTH / 2, HEIGHT / 2);
            ctx.fillStyle = "#ffffff"; ctx.font = "18px Arial";
            ctx.fillText("Clique para reiniciar", WIDTH / 2, HEIGHT / 2 + 40);

            const handleRestart = () => {
                currentState = STATE_MENU;
                canvas.removeEventListener("click", handleRestart);
            };
            canvas.addEventListener("click", handleRestart);
        }
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
