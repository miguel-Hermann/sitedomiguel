<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Floresta Sombria - Jogo de Aventura estilo Terraria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e15;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid #2a2d3d;
        }

        canvas {
            display: block;
            background-color: #000;
        }

        #controls-hint {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(15, 18, 28, 0.85);
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            pointer-events: none;
            line-height: 1.5;
            text-align: right;
            backdrop-filter: blur(4px);
        }

        #controls-hint span {
            color: #ffd700;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1000" height="600"></canvas>
    
    <div id="controls-hint">
        <b>Controles do Jogo:</b><br>
        <span>1, 2, 3, 4</span> : Equipar Itens<br>
        <span>A / D</span> : Mover | <span>Espaço</span> : Pular<br>
        <span>Shift</span> : Correr | <span>C</span> : Agachar<br>
        <span>Botão Esquerdo Mouse</span> : Atacar com Espada / Arco<br>
        <span>Botão Direito Mouse</span> : Atirar Arco / Consumir Item<br>
        <span>F</span> : Pegar Item | <span>G</span> : Dropar Item
    </div>
</div>

<script>
// --- CONFIGURAÇÃO INICIAL E CANVAS ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;
const WORLD_WIDTH = 2800;
const GROUND_Y = 480;

// --- ESTADOS DO JOGO ---
const STATE_MENU = "MENU";
const STATE_GAME = "GAME";
let currentState = STATE_MENU;

// --- ENTRADAS DE TECLADO E MOUSE ---
const keys = {};
let mousePos = { x: 0, y: 0 };
let mouseWorldPos = { x: 0, y: 0 };

window.addEventListener("keydown", (e) => {
    keys[e.key.toLowerCase()] = true;
    keys[e.code] = true;
    
    if (currentState === STATE_GAME) {
        if (e.key === "1") player.selectedSlot = 1;
        if (e.key === "2") player.selectedSlot = 2;
        if (e.key === "3") player.selectedSlot = 3;
        if (e.key === "4") player.selectedSlot = 4;

        // Pegar item com F
        if (e.key.toLowerCase() === "f") {
            pickupNearbyItems();
        }

        // Dropar item com G
        if (e.key.toLowerCase() === "g") {
            dropCurrentItem();
        }
    }
});

window.addEventListener("keyup", (e) => {
    keys[e.key.toLowerCase()] = false;
    keys[e.code] = false;
});

canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    mousePos.x = e.clientX - rect.left;
    mousePos.y = e.clientY - rect.top;
});

canvas.addEventListener("contextmenu", (e) => e.preventDefault());

canvas.addEventListener("mousedown", (e) => {
    if (currentState === STATE_MENU) {
        handleMenuClick(e);
        return;
    }

    if (currentState === STATE_GAME) {
        const now = performance.now();
        
        // Botão Esquerdo (Ataque Principal)
        if (e.button === 0) {
            if (player.selectedSlot === 1) {
                // Espada
                if (now - player.lastSwordTime >= player.swordCooldown) {
                    player.lastSwordTime = now;
                    player.swingAnim = 1.0; // Inicia animação do balanço
                    performSwordAttack();
                }
            } else if (player.selectedSlot === 3) {
                // Arco com clique esquerdo também dispara
                triggerBowShoot(now);
            }
        }

        // Botão Direito (Ação Secundária: Atirar Arco ou Consumir Item)
        if (e.button === 2) {
            if (player.selectedSlot === 3) {
                triggerBowShoot(now);
            } else if (player.selectedSlot === 4 && player.rottenMeatCount > 0) {
                // Consumir Carne Podre
                player.rottenMeatCount--;
                player.hp = Math.min(player.maxHp, player.hp + 20);
                createFloatingText(player.x + player.width/2, player.y - 10, "+20 HP", "#2ecc71");
                if (player.rottenMeatCount <= 0) {
                    player.inventory[4] = null;
                } else {
                    player.inventory[4] = `Carne Podre (${player.rottenMeatCount})`;
                }
            }
        }
    }
});

// --- SISTEMA DE CAMERA ---
let cameraX = 0;

function updateCamera() {
    cameraX = player.x + player.width / 2 - WIDTH / 2;
    if (cameraX < 0) cameraX = 0;
    if (cameraX > WORLD_WIDTH - WIDTH) cameraX = WORLD_WIDTH - WIDTH;
    
    mouseWorldPos.x = mousePos.x + cameraX;
    mouseWorldPos.y = mousePos.y;
}

// --- TEXTO FLUTUANTE DE DANO / CURA ---
let floatingTexts = [];
function createFloatingText(x, y, text, color = "#ffffff") {
    floatingTexts.push({ x, y, text, color, alpha: 1.0, vy: -1.5 });
}

function updateFloatingTexts() {
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
        let ft = floatingTexts[i];
        ft.y += ft.vy;
        ft.alpha -= 0.02;
        if (ft.alpha <= 0) {
            floatingTexts.splice(i, 1);
        }
    }
}

function drawFloatingTexts() {
    ctx.save();
    ctx.font = "bold 14px Arial";
    floatingTexts.forEach(ft => {
        ctx.globalAlpha = Math.max(0, ft.alpha);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x - cameraX, ft.y);
    });
    ctx.restore();
}

// --- CLASSES E ENTIDADES ---

// PLAYER (JOGADOR)
const player = {
    x: 140,
    y: GROUND_Y - 58,
    width: 32,
    normalHeight: 58,
    crouchHeight: 36,
    height: 58,
    vx: 0,
    vy: 0,
    isGrounded: false,
    hp: 100,
    maxHp: 100,
    
    selectedSlot: 1,
    inventory: {
        1: "Espada Pesada",
        2: "Escudo Gladiador",
        3: "Arco de Caça",
        4: null
    },
    rottenMeatCount: 0,

    // Cooldowns em ms
    lastSwordTime: 0,
    swordCooldown: 4000,
    
    lastBowTime: 0,
    bowCooldown: 4000,
    
    // Escudo
    shieldCharges: 4,
    shieldMaxCharges: 4,
    shieldRegenTimer: 0,
    shieldRegenDuration: 30000, // 15 segundos
    isRegeneratingShield: false,

    // Animações
    bowPulling: false,
    bowPullProgress: 0,
    swingAnim: 0,

    reset() {
        this.x = 140;
        this.y = GROUND_Y - 58;
        this.height = this.normalHeight;
        this.vx = 0;
        this.vy = 0;
        this.hp = 100;
        this.selectedSlot = 1;
        this.rottenMeatCount = 0;
        this.inventory[4] = null;
        this.shieldCharges = 4;
        this.isRegeneratingShield = false;
        this.lastSwordTime = -4000;
        this.lastBowTime = -4000;
    },

    update() {
        // Movimento Horizontal
        let speed = (keys["shift"] || keys["shiftleft"] || keys["shiftright"]) ? 5.5 : 3.2;
        
        // Agachar
        if (keys["c"]) {
            if (this.height !== this.crouchHeight) {
                this.height = this.crouchHeight;
                this.y += (this.normalHeight - this.crouchHeight);
            }
            speed *= 0.5; // Mais lento agachado
        } else {
            if (this.height !== this.normalHeight) {
                this.y -= (this.normalHeight - this.crouchHeight);
                this.height = this.normalHeight;
            }
        }

        this.vx = 0;
        if (keys["a"] || keys["arrowleft"]) this.vx = -speed;
        if (keys["d"] || keys["arrowright"]) this.vx = speed;

        // Pular
        if ((keys[" "] || keys["space"]) && this.isGrounded) {
            this.vy = -11.5;
            this.isGrounded = false;
        }

        // Gravidade
        this.vy += 0.55;
        this.x += this.vx;
        this.y += this.vy;

        // Colisão Mundo
        if (this.x < 0) this.x = 0;
        if (this.x > WORLD_WIDTH - this.width) this.x = WORLD_WIDTH - this.width;

        if (this.y + this.height >= GROUND_Y) {
            this.y = GROUND_Y - this.height;
            this.vy = 0;
            this.isGrounded = true;
        }

        // Regeneração do Escudo (15 Segundos)
        const now = performance.now();
        if (this.shieldCharges < this.shieldMaxCharges) {
            if (!this.isRegeneratingShield) {
                this.isRegeneratingShield = true;
                this.shieldRegenTimer = now;
            } else if (now - this.shieldRegenTimer >= this.shieldRegenDuration) {
                this.shieldCharges = this.shieldMaxCharges;
                this.isRegeneratingShield = false;
                createFloatingText(this.x + this.width/2, this.y - 15, "Escudo Regenerado!", "#3498db");
            }
        }

        // Animação de Balanço da Espada
        if (this.swingAnim > 0) {
            this.swingAnim -= 0.08;
            if (this.swingAnim < 0) this.swingAnim = 0;
        }

        // Animação de Puxada do Arco
        if (this.bowPulling) {
            this.bowPullProgress += 0.15;
            if (this.bowPullProgress >= 1) {
                this.bowPullProgress = 0;
                this.bowPulling = false;
            }
        }
    },

    draw() {
        const renderX = this.x - cameraX;

        // Sombra
        ctx.fillStyle = "rgba(0, 0, 0, 0.3)";
        ctx.beginPath();
        ctx.ellipse(renderX + this.width/2, GROUND_Y, 18, 6, 0, 0, Math.PI * 2);
        ctx.fill();

        // Corpo do Jogador (Camisa Azul)
        ctx.fillStyle = "#2980b9";
        ctx.fillRect(renderX + 4, this.y + 18, this.width - 8, this.height - 28);

        // Calça (Jeans Escuro)
        ctx.fillStyle = "#1a252f";
        ctx.fillRect(renderX + 6, this.y + this.height - 10, 8, 10);
        ctx.fillRect(renderX + this.width - 14, this.y + this.height - 10, 8, 10);

        // Cabeça
        ctx.fillStyle = "#f1c40f"; // Cabelo Loiro
        ctx.fillRect(renderX + 2, this.y, this.width - 4, 8);
        ctx.fillStyle = "#f39c12"; // Rosto / Pele
        ctx.fillRect(renderX + 4, this.y + 6, this.width - 8, 14);

        // Olho virado para o mouse
        ctx.fillStyle = "#2c3e50";
        const eyeOffsetX = (mouseWorldPos.x > this.x + this.width/2) ? 18 : 8;
        ctx.fillRect(renderX + eyeOffsetX, this.y + 10, 4, 4);

        // --- BRAÇO DIREITO E EQUIPAMENTO ---
        const shoulderX = renderX + (mouseWorldPos.x > this.x + this.width/2 ? 22 : 10);
        const shoulderY = this.y + 22;

        const angle = Math.atan2(mouseWorldPos.y - shoulderY, mouseWorldPos.x - shoulderX);
        const armLength = 16;
        
        const handX = shoulderX + Math.cos(angle) * armLength;
        const handY = shoulderY + Math.sin(angle) * armLength;

        // Desenhar Braço Direito
        ctx.strokeStyle = "#e67e22";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";
        ctx.beginPath();
        ctx.moveTo(shoulderX, shoulderY);
        ctx.lineTo(handX, handY);
        ctx.stroke();

        // Desenhar Arma / Equipamento Selecionado
        ctx.save();
        ctx.translate(handX, handY);
        ctx.rotate(angle);

        if (this.selectedSlot === 1) {
            // 1. ESPADA PESADA DE FERRO
            let swingAngle = (this.swingAnim > 0) ? Math.sin(this.swingAnim * Math.PI) * 0.8 : 0;
            ctx.rotate(swingAngle);

            // Cabo
            ctx.fillStyle = "#7f8c8d";
            ctx.fillRect(-2, -2, 8, 4);
            // Guarda
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(6, -6, 4, 12);
            // Lâmina de Ferro
            ctx.fillStyle = "#ecf0f1";
            ctx.beginPath();
            ctx.moveTo(10, -4);
            ctx.lineTo(42, -2);
            ctx.lineTo(48, 0);
            ctx.lineTo(42, 2);
            ctx.lineTo(10, 4);
            ctx.closePath();
            ctx.fill();
            ctx.strokeStyle = "#bdc3c7";
            ctx.stroke();

        } else if (this.selectedSlot === 2) {
            // 2. ESCUDO DE FERRO GLADIADOR TRIANGULAR
            ctx.rotate(Math.PI / 2); // Alinha o escudo na vertical

            // Brilho / Aura do Escudo se tiver cargas
            if (this.shieldCharges > 0) {
                ctx.fillStyle = "rgba(52, 152, 219, 0.25)";
                ctx.beginPath();
                ctx.arc(0, 0, 22, 0, Math.PI * 2);
                ctx.fill();
            }

            // Formato Triangular
            ctx.fillStyle = (this.shieldCharges > 0) ? "#95a5a6" : "#7f8c8d";
            ctx.beginPath();
            ctx.moveTo(-16, -14);
            ctx.lineTo(16, -14);
            ctx.lineTo(0, 22);
            ctx.closePath();
            ctx.fill();

            // Borda de Aço
            ctx.strokeStyle = (this.shieldCharges > 0) ? "#ecf0f1" : "#34495e";
            ctx.lineWidth = 3;
            ctx.stroke();

            // Detalhes no centro do Escudo
            ctx.fillStyle = "#c0392b";
            ctx.beginPath();
            ctx.arc(0, -2, 5, 0, Math.PI * 2);
            ctx.fill();

        } else if (this.selectedSlot === 3) {
            // 3. ARCO DE CAÇA
            const pullOffset = this.bowPullProgress * 8;

            // Arco (Madeira Curvada)
            ctx.strokeStyle = "#8e44ad";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, 20, -Math.PI / 2.2, Math.PI / 2.2);
            ctx.stroke();

            // Corda do Arco
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(Math.cos(-Math.PI / 2.2) * 20, Math.sin(-Math.PI / 2.2) * 20);
            ctx.lineTo(-pullOffset, 0);
            ctx.lineTo(Math.cos(Math.PI / 2.2) * 20, Math.sin(Math.PI / 2.2) * 20);
            ctx.stroke();

            // Flecha posicionada se estiver puxando
            if (this.bowPulling) {
                ctx.strokeStyle = "#f39c12";
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(-pullOffset, 0);
                ctx.lineTo(22, 0);
                ctx.stroke();
            }

        } else if (this.selectedSlot === 4 && this.rottenMeatCount > 0) {
            // 4. ITEM DROPAR / CARNE PODRE NA MÃO
            ctx.fillStyle = "#556b2f";
            ctx.fillRect(4, -8, 14, 16);
            ctx.strokeStyle = "#2e3b14";
            ctx.strokeRect(4, -8, 14, 16);
        }

        ctx.restore();
    }
};

// DISPARO DO ARCO
function triggerBowShoot(now) {
    if (now - player.lastBowTime >= player.bowCooldown) {
        player.lastBowTime = now;
        player.bowPulling = true;
        player.bowPullProgress = 0;

        const shoulderX = player.x + (mouseWorldPos.x > player.x + player.width/2 ? 22 : 10);
        const shoulderY = player.y + 22;
        
        projectiles.push(new Projectile(shoulderX, shoulderY, mouseWorldPos.x, mouseWorldPos.y));
    }
}

// ATAQUE COM ESPADA (HITBOX)
function performSwordAttack() {
    const attackRange = 70;
    const isFacingRight = mouseWorldPos.x >= player.x + player.width/2;

    zombies.forEach(z => {
        const inXRange = isFacingRight ? 
            (z.x >= player.x && z.x <= player.x + player.width + attackRange) :
            (z.x + z.width >= player.x - attackRange && z.x <= player.x);
        
        const inYRange = Math.abs((z.y + z.height/2) - (player.y + player.height/2)) < 50;

        if (inXRange && inYRange) {
            z.hp -= 10;
            // Impulso (Knockback)
            z.vx = isFacingRight ? 4 : -4;
            createFloatingText(z.x + z.width/2, z.y - 10, "-10 HP", "#e74c3c");
        }
    });
}

// PROJÉTEIS (FLECHAS)
class Projectile {
    constructor(x, y, targetX, targetY) {
        this.x = x;
        this.y = y;
        this.speed = 13;
        this.damage = 20;
        
        const angle = Math.atan2(targetY - y, targetX - x);
        this.vx = Math.cos(angle) * this.speed;
        this.vy = Math.sin(angle) * this.speed;
        this.active = true;
        this.width = 6;
        this.height = 6;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;

        if (this.x < 0 || this.x > WORLD_WIDTH || this.y < 0 || this.y > HEIGHT) {
            this.active = false;
        }
    }

    draw() {
        const renderX = this.x - cameraX;
        ctx.fillStyle = "#f1c40f";
        ctx.beginPath();
        ctx.arc(renderX, this.y, 4, 0, Math.PI * 2);
        ctx.fill();

        // Rastro luminoso
        ctx.strokeStyle = "rgba(241, 196, 15, 0.4)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(renderX, this.y);
        ctx.lineTo(renderX - this.vx * 2, this.y - this.vy * 2);
        ctx.stroke();
    }
}

let projectiles = [];

// DROPS DE ITENS (CARNE PODRE)
class DropItem {
    constructor(x, y, count) {
        this.x = x;
        this.y = y;
        this.width = 18;
        this.height = 18;
        this.count = count;
        this.bounce = Math.random() * Math.PI;
    }

    draw() {
        this.bounce += 0.05;
        const offsetY = Math.sin(this.bounce) * 3;
        const renderX = this.x - cameraX;

        // Desenhar pedaço de carne podre
        ctx.fillStyle = "#556b2f";
        ctx.fillRect(renderX, this.y + offsetY, this.width, this.height);
        ctx.strokeStyle = "#1e2808";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(renderX, this.y + offsetY, this.width, this.height);

        // Label da quantidade
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 10px Arial";
        ctx.fillText(`x${this.count}`, renderX + 2, this.y + offsetY - 3);
    }
}

let drops = [];

function pickupNearbyItems() {
    for (let i = drops.length - 1; i >= 0; i--) {
        let d = drops[i];
        let dist = Math.hypot((player.x + player.width/2) - (d.x + d.width/2), (player.y + player.height/2) - (d.y + d.height/2));
        if (dist < 70) {
            player.rottenMeatCount += d.count;
            player.inventory[4] = `Carne Podre (${player.rottenMeatCount})`;
            createFloatingText(d.x, d.y, `+${d.count} Carne Podre`, "#27ae60");
            drops.splice(i, 1);
        }
    }
}

function dropCurrentItem() {
    if (player.selectedSlot === 4 && player.rottenMeatCount > 0) {
        drops.push(new DropItem(player.x, player.y + 10, player.rottenMeatCount));
        createFloatingText(player.x, player.y - 10, `Dropou x${player.rottenMeatCount}`, "#e67e22");
        player.rottenMeatCount = 0;
        player.inventory[4] = null;
    }
}

// ZUMBIS (MOBS)
class Zombie {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 32;
        this.height = 58;
        this.hp = 30;
        this.maxHp = 30;
        this.speed = 1.4 + Math.random() * 0.4;
        this.damage = 8;
        this.attackCooldown = 0;
        this.vx = 0;
    }

    update() {
        if (this.attackCooldown > 0) this.attackCooldown--;

        // Desaceleração de Knockback
        this.x += this.vx;
        this.vx *= 0.8;

        // Avança em direção ao Player
        if (Math.abs(this.vx) < 0.2) {
            if (this.x < player.x) {
                this.x += this.speed;
            } else if (this.x > player.x) {
                this.x -= this.speed;
            }
        }

        // Colisão / Ataque ao Player
        if (this.checkCollision(player) && this.attackCooldown === 0) {
            this.attackCooldown = 50; // ~0.8 segundos entre ataques
            
            // Verifica se o Jogador defende com Escudo
            if (player.selectedSlot === 2 && player.shieldCharges > 0) {
                player.shieldCharges--;
                createFloatingText(player.x + player.width/2, player.y - 15, "BLOQUEADO!", "#3498db");
            } else {
                player.hp -= this.damage;
                createFloatingText(player.x + player.width/2, player.y - 15, `-${this.damage} HP`, "#e74c3c");
            }
        }
    }

    checkCollision(rect) {
        return (
            this.x < rect.x + rect.width &&
            this.x + this.width > rect.x &&
            this.y < rect.y + rect.height &&
            this.y + this.height > rect.y
        );
    }

    draw() {
        const renderX = this.x - cameraX;

        // Sombra
        ctx.fillStyle = "rgba(0, 0, 0, 0.25)";
        ctx.beginPath();
        ctx.ellipse(renderX + this.width/2, GROUND_Y, 16, 5, 0, 0, Math.PI * 2);
        ctx.fill();

        // Corpo do Zumbi (Roupas rasgadas verdes escuro)
        ctx.fillStyle = "#27ae60";
        ctx.fillRect(renderX + 4, this.y + 18, this.width - 8, this.height - 28);

        // Calça
        ctx.fillStyle = "#1e3799";
        ctx.fillRect(renderX + 6, this.y + this.height - 10, 8, 10);
        ctx.fillRect(renderX + this.width - 14, this.y + this.height - 10, 8, 10);

        // Cabeça Putrefata
        ctx.fillStyle = "#556b2f";
        ctx.fillRect(renderX + 4, this.y, this.width - 8, 18);

        // Olhos vermelhos brilhantes
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(renderX + 6, this.y + 6, 4, 4);
        ctx.fillRect(renderX + 20, this.y + 6, 4, 4);

        // Barra de Vida acima do Zumbi
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(renderX, this.y - 12, this.width, 5);
        ctx.fillStyle = "#2ecc71";
        const hpPercent = Math.max(0, this.hp / this.maxHp);
        ctx.fillRect(renderX, this.y - 12, this.width * hpPercent, 5);
    }
}

let zombies = [];

function spawnInitialZombies() {
    zombies = [
        new Zombie(750, GROUND_Y - 58),
        new Zombie(1100, GROUND_Y - 58),
        new Zombie(1500, GROUND_Y - 58)
    ];
}

// --- MENU INICIAL & INTERAÇÃO ---
const btnStart = { x: WIDTH / 2 - 110, y: 340, w: 220, h: 50 };
const btnExit = { x: WIDTH / 2 - 110, y: 410, w: 220, h: 50 };

function handleMenuClick(e) {
    if (mousePos.x >= btnStart.x && mousePos.x <= btnStart.x + btnStart.w &&
        mousePos.y >= btnStart.y && mousePos.y <= btnStart.y + btnStart.h) {
        
        // Iniciar Jogo
        player.reset();
        spawnInitialZombies();
        projectiles = [];
        drops = [];
        floatingTexts = [];
        currentState = STATE_GAME;
    } else if (mousePos.x >= btnExit.x && mousePos.x <= btnExit.x + btnExit.w &&
               mousePos.y >= btnExit.y && mousePos.y <= btnExit.y + btnExit.h) {
        alert("Obrigado por jogar Floresta Sombria!");
    }
}

function drawMenu() {
    // Fundo da Sala Intro
    ctx.fillStyle = "#1a0f0a";
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    // Paredes de Madeira
    ctx.fillStyle = "#2c1d11";
    for (let x = 0; x < WIDTH; x += 40) {
        ctx.fillRect(x, 0, 38, HEIGHT);
    }

    // Porta no meio com Luz Brilhante no fundo
    const doorX = WIDTH / 2 - 65;
    const doorY = 160;
    const doorW = 130;
    const doorH = 240;

    // Gradiente de Luz Brilhante saindo da porta
    const lightGrd = ctx.createRadialGradient(WIDTH / 2, doorY + doorH/2, 10, WIDTH / 2, doorY + doorH/2, 220);
    lightGrd.addColorStop(0, "#ffffff");
    lightGrd.addColorStop(0.3, "#f39c12");
    lightGrd.addColorStop(0.8, "rgba(241, 196, 15, 0.3)");
    lightGrd.addColorStop(1, "rgba(0, 0, 0, 0)");

    ctx.fillStyle = lightGrd;
    ctx.fillRect(doorX - 100, doorY - 50, doorW + 200, doorH + 100);

    // Estrutura da Porta Aberta
    ctx.fillStyle = "#f1c40f";
    ctx.fillRect(doorX, doorY, doorW, doorH);

    ctx.strokeStyle = "#4a2c11";
    ctx.lineWidth = 8;
    ctx.strokeRect(doorX, doorY, doorW, doorH);

    // Armas Penduradas nas Paredes da Sala
    // Espada à esquerda
    ctx.strokeStyle = "#bdc3c7";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(180, 220);
    ctx.lineTo(220, 260);
    ctx.stroke();
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(175, 215, 12, 12);

    // Arco à direita
    ctx.strokeStyle = "#8e44ad";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(800, 240, 30, -Math.PI / 2, Math.PI / 2);
    ctx.stroke();

    // Título Principal
    ctx.fillStyle = "#f39c12";
    ctx.font = "bold 38px 'Segoe UI', Arial";
    ctx.textAlign = "center";
    ctx.fillText("FLORESTA SOMBRIA", WIDTH / 2, 90);

    ctx.fillStyle = "#ecf0f1";
    ctx.font = "16px Arial";
    ctx.fillText("Aventura em Mundo Aberto", WIDTH / 2, 120);

    // Botão INICIAR JOGO
    const isHoverStart = mousePos.x >= btnStart.x && mousePos.x <= btnStart.x + btnStart.w &&
                         mousePos.y >= btnStart.y && mousePos.y <= btnStart.y + btnStart.h;
    
    ctx.fillStyle = isHoverStart ? "#27ae60" : "#2ecc71";
    ctx.beginPath();
    ctx.roundRect(btnStart.x, btnStart.y, btnStart.w, btnStart.h, 8);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px Arial";
    ctx.fillText("INICIAR JOGO", WIDTH / 2, btnStart.y + 32);

    // Botão SAIR
    const isHoverExit = mousePos.x >= btnExit.x && mousePos.x <= btnExit.x + btnExit.w &&
                        mousePos.y >= btnExit.y && mousePos.y <= btnExit.y + btnExit.h;
    
    ctx.fillStyle = isHoverExit ? "#c0392b" : "#e74c3c";
    ctx.beginPath();
    ctx.roundRect(btnExit.x, btnExit.y, btnExit.w, btnExit.h, 8);
    ctx.fill();
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 20px Arial";
    ctx.fillText("SAIR", WIDTH / 2, btnExit.y + 32);
}

// --- LÓGICA DO MUNDO DO JOGO ---
function drawWorldBackground() {
    // Céu com gradiente
    const skyGrd = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    skyGrd.addColorStop(0, "#1a2a3a");
    skyGrd.addColorStop(1, "#3a5a7a");
    ctx.fillStyle = skyGrd;
    ctx.fillRect(0, 0, WIDTH, GROUND_Y);

    // Árvores Distantes (Parallax)
    ctx.fillStyle = "#1e382b";
    for (let x = -cameraX * 0.3; x < WIDTH + 200; x += 140) {
        ctx.fillRect(x + 50, GROUND_Y - 140, 24, 140);
        ctx.beginPath();
        ctx.arc(x + 62, GROUND_Y - 150, 48, 0, Math.PI * 2);
        ctx.fill();
    }

    // Floresta Principal (Árvores Próximas)
    for (let x = 300; x < WORLD_WIDTH; x += 220) {
        const renderX = x - cameraX;
        if (renderX > -100 && renderX < WIDTH + 100) {
            // Tronco
            ctx.fillStyle = "#4a2c11";
            ctx.fillRect(renderX, GROUND_Y - 180, 36, 180);
            
            // Copa da Árvore
            ctx.fillStyle = "#145a32";
            ctx.beginPath();
            ctx.arc(renderX + 18, GROUND_Y - 200, 65, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    // Cabana Inicial do Jogador (Esquerda do Mapa)
    const houseX = 40 - cameraX;
    if (houseX + 220 > 0 && houseX < WIDTH) {
        // Parede de Madeira da Casa
        ctx.fillStyle = "#5d4037";
        ctx.fillRect(houseX, GROUND_Y - 130, 200, 130);

        // Telhado
        ctx.fillStyle = "#3e2723";
        ctx.beginPath();
        ctx.moveTo(houseX - 15, GROUND_Y - 130);
        ctx.lineTo(houseX + 100, GROUND_Y - 190);
        ctx.lineTo(houseX + 215, GROUND_Y - 130);
        ctx.closePath();
        ctx.fill();

        // Cama ao Lado da qual o Player Acorda
        ctx.fillStyle = "#7f8c8d";
        ctx.fillRect(houseX + 30, GROUND_Y - 22, 60, 22); // Estrutura Cama
        ctx.fillStyle = "#e74c3c";
        ctx.fillRect(houseX + 45, GROUND_Y - 28, 45, 10); // Coberta
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(houseX + 32, GROUND_Y - 28, 12, 10); // Travesseiro
    }

    // Chão de Grama e Terra
    ctx.fillStyle = "#27ae60"; // Grama
    ctx.fillRect(0, GROUND_Y, WIDTH, 16);
    ctx.fillStyle = "#795548"; // Terra
    ctx.fillRect(0, GROUND_Y + 16, WIDTH, HEIGHT - GROUND_Y - 16);
}

function drawHUD() {
    const now = performance.now();

    // Barra de Vida
    ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
    ctx.fillRect(16, 16, 208, 22);
    ctx.fillStyle = "#e74c3c";
    ctx.fillRect(20, 20, Math.max(0, (player.hp / player.maxHp) * 200), 14);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 12px Arial";
    ctx.textAlign = "left";
    ctx.fillText(`VIDA: ${Math.ceil(player.hp)} / ${player.maxHp}`, 26, 32);

    // --- BARRA INFERIOR DE INVENTÁRIO ---
    const slotW = 75;
    const slotH = 50;
    const totalW = slotW * 4 + 30;
    const startX = (WIDTH - totalW) / 2;
    const startY = HEIGHT - 70;

    // Fundo do Inventário
    ctx.fillStyle = "rgba(15, 18, 28, 0.9)";
    ctx.beginPath();
    ctx.roundRect(startX - 10, startY - 8, totalW + 20, slotH + 16, 8);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
    ctx.lineWidth = 1.5;
    ctx.stroke();

    for (let slot = 1; slot <= 4; slot++) {
        const x = startX + (slot - 1) * (slotW + 10);
        const y = startY;

        const isSelected = (player.selectedSlot === slot);
        ctx.fillStyle = isSelected ? "rgba(52, 152, 219, 0.3)" : "rgba(255, 255, 255, 0.05)";
        ctx.beginPath();
        ctx.roundRect(x, y, slotW, slotH, 6);
        ctx.fill();

        ctx.strokeStyle = isSelected ? "#f1c40f" : "rgba(255, 255, 255, 0.2)";
        ctx.lineWidth = isSelected ? 2.5 : 1;
        ctx.stroke();

        // Número do Slot
        ctx.fillStyle = "#f1c40f";
        ctx.font = "bold 11px Arial";
        ctx.fillText(`[${slot}]`, x + 5, y + 14);

        // Nome / Status do Item
        ctx.fillStyle = "#ffffff";
        ctx.font = "10px Arial";
        
        let label = "Vazio";
        let subText = "";

        if (slot === 1) {
            label = "Espada";
            const cd = Math.max(0, ((player.swordCooldown - (now - player.lastSwordTime)) / 1000)).toFixed(1);
            if (cd > 0) subText = `${cd}s`;
        } else if (slot === 2) {
            label = "Escudo";
            subText = `${player.shieldCharges}/4 Def`;
            if (player.shieldCharges < 4) {
                const regenCD = Math.max(0, ((player.shieldRegenDuration - (now - player.shieldRegenTimer)) / 1000)).toFixed(0);
                subText += ` (${regenCD}s)`;
            }
        } else if (slot === 3) {
            label = "Arco";
            const cd = Math.max(0, ((player.bowCooldown - (now - player.lastBowTime)) / 1000)).toFixed(1);
            if (cd > 0) subText = `${cd}s`;
        } else if (slot === 4) {
            if (player.rottenMeatCount > 0) {
                label = "Carne Podre";
                subText = `qtd: ${player.rottenMeatCount}`;
            }
        }

        ctx.fillText(label, x + 5, y + 28);
        if (subText) {
            ctx.fillStyle = "#e67e22";
            ctx.fillText(subText, x + 5, y + 42);
        }
    }
}

// --- GAMELOOP PRINCIPAL ---
function gameLoop() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    if (currentState === STATE_MENU) {
        drawMenu();
    } else if (currentState === STATE_GAME) {
        // Atualizações
        player.update();
        updateCamera();

        // Coleta automática se aproximar dos drops
        for (let i = drops.length - 1; i >= 0; i--) {
            let d = drops[i];
            let dist = Math.hypot((player.x + player.width/2) - (d.x + d.width/2), (player.y + player.height/2) - (d.y + d.height/2));
            if (dist < 32) {
                player.rottenMeatCount += d.count;
                player.inventory[4] = `Carne Podre (${player.rottenMeatCount})`;
                createFloatingText(d.x, d.y, `+${d.count} Carne Podre`, "#27ae60");
                drops.splice(i, 1);
            }
        }

        // Atualizar Projéteis
        for (let i = projectiles.length - 1; i >= 0; i--) {
            let p = projectiles[i];
            p.update();
            if (!p.active) {
                projectiles.splice(i, 1);
                continue;
            }

            // Colisão Flecha -> Zumbi
            for (let z of zombies) {
                if (p.x >= z.x && p.x <= z.x + z.width && p.y >= z.y && p.y <= z.y + z.height) {
                    z.hp -= p.damage;
                    z.vx = (p.vx > 0) ? 3 : -3; // Impulso
                    createFloatingText(z.x + z.width/2, z.y - 10, `-${p.damage} HP`, "#f1c40f");
                    p.active = false;
                    break;
                }
            }
        }

        // Atualizar Zumbis
        for (let i = zombies.length - 1; i >= 0; i--) {
            let z = zombies[i];
            z.update();

            // Morte do Zumbi -> Dropa de 1 a 3 Carnes Podres
            if (z.hp <= 0) {
                const count = Math.floor(Math.random() * 3) + 1;
                drops.push(new DropItem(z.x + z.width/2, GROUND_Y - 20, count));
                zombies.splice(i, 1);
            }
        }

        // Respawn de Zumbis para manter a jogabilidade viva na floresta
        if (zombies.length < 3 && Math.random() < 0.008) {
            const spawnX = Math.random() < 0.5 ? player.x - 500 : player.x + 500;
            if (spawnX > 300 && spawnX < WORLD_WIDTH) {
                zombies.push(new Zombie(spawnX, GROUND_Y - 58));
            }
        }

        updateFloatingTexts();

        // Renderização do Jogo
        drawWorldBackground();

        drops.forEach(d => d.draw());
        projectiles.forEach(p => p.draw());
        zombies.forEach(z => z.draw());
        player.draw();

        drawFloatingTexts();
        drawHUD();

        // Game Over
        if (player.hp <= 0) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);
            ctx.fillStyle = "#e74c3c";
            ctx.font = "bold 42px Arial";
            ctx.textAlign = "center";
            ctx.fillText("VOCÊ MORREU", WIDTH / 2, HEIGHT / 2 - 20);
            ctx.fillStyle = "#ffffff";
            ctx.font = "18px Arial";
            ctx.fillText("Clique para Voltar ao Menu", WIDTH / 2, HEIGHT / 2 + 30);

            const handleRestart = () => {
                currentState = STATE_MENU;
                canvas.removeEventListener("click", handleRestart);
            };
            canvas.addEventListener("click", handleRestart);
        }
    }

    requestAnimationFrame(gameLoop);
}

// Iniciar Loop
requestAnimationFrame(gameLoop);
</script>

</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Survival Wave Game</title>
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        canvas { display: block; margin: 0 auto; background: #222; }
    </style>
</head>
<body>
<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// --- ESTADO DO JOGO ---
let onda = 1;
let mobsRestantes = 0;
let chaoItens = [];
let teclas = {};

window.addEventListener("keydown", e => { teclas[e.key.toLowerCase()] = true; });
window.addEventListener("keyup", e => { teclas[e.key.toLowerCase()] = false; });

// --- JOGADOR ---
const player = {
    x: 400, y: 300, r: 15, hp: 100, maxHp: 100,
    slots: [null, null, null, null, null], // 5 Slots
    flechasOssos: 0,
    cooldowns: { espada: 0, arco: 0, escudoRegen: 0 },
    escudoAtivo: false,
    veneno: { ativo: false, tempo: 0, timerDano: 0 }
};

// --- Mobs & Bosses ---
let mobs = [];
let projeteis = [];
let bossAtual = null;

class Enemy {
    constructor(x, y, tipo) {
        this.x = x; this.y = y; this.tipo = tipo;
        if(tipo === 'zumbi') { this.hp = 30; this.r = 15; this.cor = '#2e7d32'; }
        if(tipo === 'esqueleto') { this.hp = 25; this.r = 12; this.cor = '#e0e0e0'; this.cooldownTiro = 0; }
        if(tipo === 'aranha') { this.hp = 40; this.r = 10; this.cor = '#8e24aa'; }
    }
    update() {
        let dx = player.x - this.x;
        let dy = player.y - this.y;
        let dist = Math.hypot(dx, dy);
        
        // Movimento básico
        if (dist > 20) {
            this.x += (dx / dist) * 1.5;
            this.y += (dy / dist) * 1.5;
        }

        // Ataque Esqueleto (Arco: 3.5s)
        if (this.tipo === 'esqueleto') {
            this.cooldownTiro += 1/60;
            if (this.cooldownTiro >= 3.5) {
                projeteis.push({ x: this.x, y: this.y, vx: (dx/dist)*4, vy: (dy/dist)*4, dano: 10, deInimigo: true, tipo: 'flecha' });
                this.cooldownTiro = 0;
            }
        }

        // Ataque Aranha (Dano + Veneno)
        if (this.tipo === 'aranha' && dist < 25) {
            if (!player.veneno.ativo) {
                player.hp -= 10;
                player.veneno = { ativo: true, tempo: 5, timerDano: 0 };
            }
        }
    }
    draw() {
        ctx.fillStyle = this.cor;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
        if(this.tipo === 'esqueleto') ctx.strokeText("🏹", this.x - 5, this.y + 4);
    }
}

class Boss {
    constructor(nome, hp, cor) {
        this.nome = nome; this.hp = hp; this.maxHp = hp;
        this.x = 400; this.y = 100; this.r = 30; this.cor = cor;
        this.timerAtaque = 0;
        this.voador = (nome === 'Fenix');
        this.caido = false;
        this.timerQueda = 0;
    }
    update() {
        this.timerAtaque += 1/60;
        
        // Lógica Fenix
        if (this.nome === 'Fenix' && !this.caido) {
            if (this.timerAtaque >= 3) {
                projeteis.push({ x: this.x, y: this.y, vx: 0, vy: 5, dano: 20, deInimigo: true, tipo: 'fogo' });
                this.timerAtaque = 0;
            }
        }
        
        // Lógica Yeti (Troca de ataques a cada 3s)
        if (this.nome === 'Yeti' && this.timerAtaque >= 3) {
            let rand = Math.random();
            if (rand < 0.5) {
                // Parede de Gelo (Desvia Pulo)
                projeteis.push({ x: 0, y: player.y, vx: 5, vy: 0, largura: 20, altura: 100, dano: 30, tipo: 'paredeGelo', deInimigo: true });
            } else {
                // Projéteis de Gelo
                projeteis.push({ x: this.x, y: this.y, vx: (player.x - this.x)*0.02, vy: (player.y - this.y)*0.02, dano: 30, tipo: 'gelo', deInimigo: true });
            }
            this.timerAtaque = 0;
        }

        if (this.caido) {
            this.timerQueda -= 1/60;
            if (this.timerQueda <= 0) this.caido = false;
        }
    }
    draw() {
        ctx.fillStyle = this.caido ? '#555' : this.cor;
        ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI*2); ctx.fill();
    }
}

// --- CONTROLE DE ONDAS ---
function iniciarOnda(num) {
    mobs = [];
    bossAtual = null;
    
    if (num === 5) {
        bossAtual = new Boss('Yeti', 200, '#00d2ff');
        mobs.push(new Enemy(100, 100, 'zumbi'), new Enemy(700, 100, 'esqueleto'));
    } else if (num === 10) {
        bossAtual = new Boss('Fenix', 300, '#ff3d00');
        mobs.push(new Enemy(100, 100, 'aranha'), new Enemy(700, 100, 'aranha'));
    } else if (num === 15) {
        // Boss Final: Fada da Natureza + Guardião
        bossAtual = new Boss('Fada da Natureza', 600, '#00e676');
        mobs.push(new Enemy(300, 200, 'zumbi')); // Guardião customizável
    } else {
        let qtd = 6 + (num * 2);
        for(let i=0; i<qtd; i++) {
            let tipo = i % 3 === 0 ? 'esqueleto' : (i % 3 === 1 ? 'aranha' : 'zumbi');
            mobs.push(new Enemy(Math.random()*700 + 50, Math.random()*200, tipo));
        }
    }
}

// --- LOOP PRINCIPAL ---
function update() {
    // Timers Cooldowns
    if (player.cooldowns.espada > 0) player.cooldowns.espada -= 1/60;
    if (player.cooldowns.arco > 0) player.cooldowns.arco -= 1/60;
    if (player.cooldowns.escudoRegen > 0) player.cooldowns.escudoRegen -= 1/60;

    // Processar Veneno
    if (player.veneno.ativo) {
        player.veneno.tempo -= 1/60;
        player.veneno.timerDano += 1/60;
        if (player.veneno.timerDano >= 1.0) {
            player.hp -= 4;
            player.veneno.timerDano = 0;
        }
        if (player.veneno.tempo <= 0) player.veneno.ativo = false;
    }

    // Coletar Itens do Chão (Tecla F)
    if (teclas['f']) {
        chaoItens = chaoItens.filter(item => {
            let dist = Math.hypot(player.x - item.x, player.y - item.y);
            if (dist < 40) {
                if (item.tipo === 'osso') player.flechasOssos += 1;
                return false;
            }
            return true;
        });
    }

    // Atualizar Mobs & Boss
    mobs.forEach((m, idx) => {
        m.update();
        if (m.hp <= 0) {
            if (m.tipo === 'esqueleto') chaoItens.push({ x: m.x, y: m.y, tipo: 'osso' });
            mobs.splice(idx, 1);
        }
    });

    if (bossAtual) {
        bossAtual.update();
        if (bossAtual.hp <= 0) {
            if (bossAtual.nome === 'Yeti') chaoItens.push({ x: bossAtual.x, y: bossAtual.y, tipo: 'espadaGelo' });
            if (bossAtual.nome === 'Fenix') chaoItens.push({ x: bossAtual.x, y: bossAtual.y, tipo: 'arcoFogo' });
            bossAtual = null;
        }
    }

    // Checar Fim de Onda
    if (mobs.length === 0 && !bossAtual) {
        onda++;
        iniciarOnda(onda);
    }
}

function drawHUD() {
    // Placar da Onda (Topo Centralizado)
    ctx.fillStyle = "#fff";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(`Onda ${onda}`, canvas.width / 2, 30);

    // Barra do Boss (Se ativo)
    if (bossAtual) {
        ctx.fillStyle = "#333";
        ctx.fillRect(200, 45, 400, 20);
        ctx.fillStyle = bossAtual.cor;
        ctx.fillRect(200, 45, (bossAtual.hp / bossAtual.maxHp) * 400, 20);
        ctx.fillStyle = "#fff";
        ctx.font = "14px sans-serif";
        ctx.fillText(`[${bossAtual.nome}]`, canvas.width / 2, 60);
    }

    // 5 Slots de Inventário (Rodapé)
    for (let i = 0; i < 5; i++) {
        ctx.strokeStyle = "#fff";
        ctx.strokeRect(270 + (i * 50), 530, 40, 40);
        ctx.fillStyle = "#aaa";
        ctx.font = "10px sans-serif";
        ctx.fillText(`Slot ${i+1}`, 290 + (i * 50), 565);
    }

    // Itens no Chão
    chaoItens.forEach(item => {
        ctx.fillStyle = item.tipo === 'osso' ? '#fff' : '#ffd700';
        ctx.beginPath(); ctx.arc(item.x, item.y, 6, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.fillText("[F] Pegar " + item.tipo, item.x, item.y - 10);
    });
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Desenhar Player
    ctx.fillStyle = player.veneno.ativo ? '#76ff03' : '#29b6f6';
    ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();

    mobs.forEach(m => m.draw());
    if (bossAtual) bossAtual.draw();
    
    drawHUD();
}

function gameLoop() {
    update();
    render();
    requestAnimationFrame(gameLoop);
